{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMMI PDF Upload</title>
  <link rel="icon" href="{% static 'login-form/images/GMMI_LOGO.png' %}" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #4b44c6;
      --secondary: #2ed573;
      --accent: #ff4757;
      --text: #2d3436;
      --light: #f5f6fa;
      --dark: #2d3436;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.1) 0%, rgba(46, 213, 115, 0.1) 100%), 
                  url("{% static 'login-form/images/wall3.jpg' %}") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Preloader Styles */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--light);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .preloader-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      background: url("{% static 'login-form/images/GMMI_LOGO.png' %}") no-repeat center center;
      background-size: contain;
      animation: pulse 2s infinite ease-in-out;
    }

    .preloader-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--primary);
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .preloader-bar {
      width: 300px;
      height: 8px;
      background: rgba(108, 92, 231, 0.2);
      border-radius: 10px;
      margin-top: 30px;
      overflow: hidden;
      position: relative;
    }

    .preloader-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      animation: loading 2s ease-in-out forwards;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @keyframes loading {
      0% { width: 0; }
      100% { width: 100%; }
    }

    /* Main Content */
    .upload-container {
      width: 100%;
      max-width: 550px;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      margin: 20px;
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 0.8s 0.5s forwards;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .upload-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
                  transparent 0%, 
                  rgba(108, 92, 231, 0.05) 30%, 
                  rgba(46, 213, 115, 0.05) 70%, 
                  transparent 100%);
      transform: rotate(45deg);
      z-index: -1;
      animation: shine 8s infinite linear;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    .upload-container h3 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 25px;
      color: var(--primary);
      position: relative;
      display: inline-block;
    }

    .upload-container h3::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 3px;
    }

    .drop-area {
      border: 2px dashed var(--primary);
      padding: 30px;
      border-radius: 15px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: var(--transition);
      background: rgba(108, 92, 231, 0.05);
      position: relative;
      overflow: hidden;
    }

    .drop-area:hover {
      background: rgba(108, 92, 231, 0.1);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.2);
    }

    .drop-area.highlight {
      background: rgba(46, 213, 115, 0.1);
      border-color: var(--secondary);
    }

    .drop-area i {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 15px;
      display: block;
    }

    .drop-area p {
      margin: 10px 0;
      color: var(--dark);
    }

    .drop-area button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      margin-top: 10px;
    }

    .drop-area button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(108, 92, 231, 0.3);
    }

    #fileList {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(108, 92, 231, 0.1);
    }

    #fileList::-webkit-scrollbar {
      width: 6px;
    }

    #fileList::-webkit-scrollbar-track {
      background: rgba(108, 92, 231, 0.1);
      border-radius: 10px;
    }

    #fileList::-webkit-scrollbar-thumb {
      background-color: var(--primary);
      border-radius: 10px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: white;
      margin-top: 8px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
      border-left: 4px solid var(--primary);
    }

    .file-item:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .file-item span:first-child {
      flex: 1;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 10px;
    }

    .file-item .remove-btn {
      color: var(--accent);
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: var(--transition);
      padding: 5px;
    }

    .file-item .remove-btn:hover {
      transform: scale(1.2);
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: var(--transition);
      background: rgba(255, 255, 255, 0.8);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
    }

    .dashed-input-box {
      border: 2px dashed #ddd;
      border-radius: 15px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      cursor: pointer;
      transition: var(--transition);
    }

    .dashed-input-box:hover {
      background-color: rgba(108, 92, 231, 0.05);
      border-color: var(--primary);
    }

    .dashed-label {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 500;
    }

    .dashed-input-box input[type="date"],
    .dashed-input-box input[type="time"] {
      width: 100%;
      max-width: 200px;
      border: none;
      background: transparent;
      font-size: 16px;
      text-align: center;
      outline: none;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      color: var(--dark);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: 600;
      font-size: 16px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .send-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
    }

    .send-btn:active {
      transform: translateY(1px);
    }

    .send-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
                  transparent 0%, 
                  rgba(255, 255, 255, 0.3) 50%, 
                  transparent 100%);
      transform: translateX(-100%) rotate(45deg);
      transition: transform 0.6s ease;
    }

    .send-btn:hover::after {
      transform: translateX(100%) rotate(45deg);
    }

    /* Home Button */
    .home-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 14px 35px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
      margin: 20px 0;
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .home-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
    }

    .home-btn:active {
      transform: translateY(1px);
    }

    .home-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
                  transparent 0%, 
                  rgba(255, 255, 255, 0.3) 50%, 
                  transparent 100%);
      transform: translateX(-100%) rotate(45deg);
      transition: transform 0.6s ease;
    }

    .home-btn:hover::after {
      transform: translateX(100%) rotate(45deg);
    }

    /* Ultimate Powerful Loader Overlay */
    #crazyLoaderOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
    }

    .powerful-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 500px;
    }

    .loader-text {
      color: white;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .galaxy-loader {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    .galaxy-core {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 30px var(--primary), 0 0 60px rgba(108, 92, 231, 0.5);
      z-index: 2;
      animation: pulseCore 2s infinite ease-in-out;
    }

    @keyframes pulseCore {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    .orbit {
      position: absolute;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit-1 {
      width: 120px;
      height: 120px;
    }

    .orbit-2 {
      width: 180px;
      height: 180px;
    }

    .orbit-3 {
      width: 240px;
      height: 240px;
    }

    .particle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 10px var(--secondary);
      transform-origin: center;
    }

    .particle-1 {
      top: 10px;
      left: 50%;
      margin-left: -6px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      animation: orbit1 4s linear infinite;
    }

    .particle-2 {
      top: 50%;
      right: 10px;
      margin-top: -6px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: orbit2 5s linear infinite;
    }

    .particle-3 {
      bottom: 10px;
      left: 50%;
      margin-left: -6px;
      background: #1e90ff;
      box-shadow: 0 0 10px #1e90ff;
      animation: orbit3 6s linear infinite;
    }

    .particle-4 {
      top: 50%;
      left: 10px;
      margin-top: -6px;
      background: #ffa502;
      box-shadow: 0 0 10px #ffa502;
      animation: orbit4 7s linear infinite;
    }

    @keyframes orbit1 {
      0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
    }

    @keyframes orbit2 {
      0% { transform: rotate(0deg) translateX(90px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
    }

    @keyframes orbit3 {
      0% { transform: rotate(0deg) translateX(120px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
    }

    @keyframes orbit4 {
      0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
    }

    .progress-container {
      width: 80%;
      max-width: 400px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 40px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .percentage {
      position: absolute;
      right: 10px;
      top: -25px;
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
      .upload-container {
        padding: 30px 20px;
        margin: 15px;
        max-width: 95%;
      }

      .upload-container h3 {
        font-size: 24px;
      }

      .drop-area {
        padding: 20px;
      }

      .home-btn {
        padding: 12px 25px;
        font-size: 14px;
      }

      .galaxy-loader {
        width: 150px;
        height: 150px;
      }

      .orbit-1 {
        width: 90px;
        height: 90px;
      }

      .orbit-2 {
        width: 135px;
        height: 135px;
      }

      .orbit-3 {
        width: 180px;
        height: 180px;
      }

      .particle {
        width: 10px;
        height: 10px;
      }
    }

    @media (max-width: 480px) {
      .upload-container {
        padding: 25px 15px;
      }

      .dashed-input-box {
        padding: 15px;
      }

      .dashed-input-box input[type="date"],
      .dashed-input-box input[type="time"] {
        max-width: 150px;
      }

      .galaxy-loader {
        width: 120px;
        height: 120px;
      }

      .orbit-1 {
        width: 70px;
        height: 70px;
      }

      .orbit-2 {
        width: 100px;
        height: 100px;
      }

      .orbit-3 {
        width: 130px;
        height: 130px;
      }

      .particle {
        width: 8px;
        height: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="preloader-logo"></div>
    <div class="preloader-text">Loading GMMI Portal</div>
    <div class="preloader-bar">
      <div class="preloader-progress"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="upload-container">
    <h3>Upload PDF Files</h3>
    <form method="POST" enctype="multipart/form-data" id="uploadForm">
      {% csrf_token %}

      <div class="drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Drag & Drop your files here</p>
        <p>or</p>
        <button type="button">Browse Files</button>
      </div>

      <input type="file" id="fileInput" name="pdf_files" multiple accept=".pdf" style="display: none;" onchange="handleFiles(event)">
      <div id="fileList"></div>

      <!-- Company/Location -->
      <div class="input-group">
        <label for="company_location">Company/Location:</label>
        <input type="text" id="company_location" name="company_location" placeholder="Enter company or location or title" required>
      </div>

      <!-- Image Upload -->
      <div class="input-group">
        <label for="image">Upload Image (Optional):</label>
        <input type="file" id="image" name="image" accept="image/*">
      </div>

      <!-- Info ID -->
      <div class="input-group">
        <label for="info_id">Information ID (Optional):</label>
        <input type="text" id="info_id" name="info_id" placeholder="Enter Identification numbers of file">
      </div>

      <!-- Date -->
      <label class="dashed-input-box">
        <span class="dashed-label">Select Date</span>
        <input type="date" name="date" required>
      </label>

      <!-- Time -->
      <label class="dashed-input-box">
        <span class="dashed-label">Select Time</span>
        <input type="time" name="time" required>
      </label>

      <button type="submit" class="send-btn" id="submitBtn">
        <span id="btnText">Upload Files</span>
      </button>
    </form>
  </div>

  <!-- Home Button -->
  <a href="{% url 'pdf_document' %}" class="home-btn">Go to PDF Page</a>

  <!-- Ultimate Powerful Loader Overlay -->
  <div id="crazyLoaderOverlay">
    <div class="powerful-loader">
      <div class="loader-text">PROCESSING YOUR FILES</div>
      
      <div class="galaxy-loader">
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>
        
        <div class="galaxy-core"></div>
        
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="percentage" id="percentage">0%</div>
      </div>
    </div>
  </div>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <script>
    // Preloader
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('preloader').style.opacity = '0';
        setTimeout(function() {
          document.getElementById('preloader').style.display = 'none';
        }, 500);
      }, 1500);
    });

    // Drag and drop functionality
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropArea.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
      dropArea.classList.add('highlight');
    }

    function unhighlight() {
      dropArea.classList.remove('highlight');
    }

    dropArea.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      fileInput.files = files;
      handleFiles({ target: fileInput });
    }

    // File handling
    function handleFiles(event) {
      const fileList = document.getElementById("fileList");
      fileList.innerHTML = "";
      
      Array.from(event.target.files).forEach(file => {
        const fileItem = document.createElement("div");
        fileItem.classList.add("file-item");
        
        const fileName = document.createElement("span");
        fileName.textContent = file.name;
        
        const removeButton = document.createElement("span");
        removeButton.innerHTML = "&times;";
        removeButton.classList.add("remove-btn");
        removeButton.onclick = () => {
          fileItem.remove();
          // Create new FileList without the removed file
          const newFiles = Array.from(fileInput.files).filter(f => f.name !== file.name);
          const dataTransfer = new DataTransfer();
          newFiles.forEach(f => dataTransfer.items.add(f));
          fileInput.files = dataTransfer.files;
        };
        
        fileItem.appendChild(fileName);
        fileItem.appendChild(removeButton);
        fileList.appendChild(fileItem);
      });
    }

    // Form submission with powerful loader
    document.getElementById("uploadForm").addEventListener("submit", function(e) {
      const overlay = document.getElementById("crazyLoaderOverlay");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const progressBar = document.getElementById("progressBar");
      const percentage = document.getElementById("percentage");
      
      // Show loader
      overlay.style.display = "flex";
      submitBtn.disabled = true;
      btnText.textContent = "Uploading...";
      
      // Simulate progress (will be replaced by actual upload progress)
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 5;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + "%";
        percentage.textContent = Math.round(progress) + "%";
      }, 200);
      
      // The form will submit normally and redirect to the PDF page
      // The loader will remain visible during the actual file upload process
    });
  </script>
</body>
</html>
