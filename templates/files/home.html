{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMMI Church Upload</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --danger: #ff4757;
      --success: #2ed573;
      --dark: #2d3436;
      --gold: #ffd700;
      --gold-light: #fffacd;
      --stained-glass-blue: #1e88e5;
      --stained-glass-red: #e53935;
      --stained-glass-purple: #8e24aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Sacred Preloader */
    #sacredPreloader {
      position: fixed; 
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      z-index: 9999; 
      transition: opacity 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .sacred-symbol {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .stained-glass {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(45deg, 
          var(--stained-glass-blue) 0%, 
          var(--stained-glass-red) 50%, 
          var(--stained-glass-purple) 100%);
      border-radius: 50%;
      opacity: 0.8;
      box-shadow: 0 0 30px rgba(30, 136, 229, 0.3);
    }

    .cross {
      position: absolute;
      width: 40px;
      height: 120px;
      background-color: white;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .cross:after {
      content: '';
      position: absolute;
      width: 120px;
      height: 40px;
      background-color: white;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .halo {
      position: absolute;
      width: 220px;
      height: 220px;
      top: -10px;
      left: -10px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      animation: haloPulse 3s ease-in-out infinite;
    }

    @keyframes haloPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px var(--gold); }
    }

    .light-ray {
      position: absolute;
      width: 4px;
      height: 100px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
      top: 50%;
      left: 50%;
      transform-origin: top center;
      animation: lightRayRotate 8s linear infinite;
    }

    .light-ray:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
    .light-ray:nth-child(2) { transform: translate(-50%, -50%) rotate(45deg); }
    .light-ray:nth-child(3) { transform: translate(-50%, -50%) rotate(90deg); }
    .light-ray:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg); }
    .light-ray:nth-child(5) { transform: translate(-50%, -50%) rotate(180deg); }
    .light-ray:nth-child(6) { transform: translate(-50%, -50%) rotate(225deg); }
    .light-ray:nth-child(7) { transform: translate(-50%, -50%) rotate(270deg); }
    .light-ray:nth-child(8) { transform: translate(-50%, -50%) rotate(315deg); }

    @keyframes lightRayRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .preloader-text {
      color: white;
      margin-top: 40px;
      font-size: 1.2rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    .preloader-progress {
      width: 300px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .preloader-progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--stained-glass-blue), var(--gold));
      animation: loadingProgress 2s ease-in-out forwards;
    }

    @keyframes loadingProgress {
      0% { width: 0; }
      100% { width: 100%; }
    }

    /* Main container */
    .upload-container {
      width: 100%; 
      max-width: 500px; 
      background: white;
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden; 
      margin: 20px 0;
      transform: translateY(20px); 
      opacity: 0;
      animation: slideUp 0.5s ease-out 0.3s forwards;
    }

    @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

    .upload-header {
      background: linear-gradient(to right, var(--primary), #8e44ad);
      color: white; 
      padding: 20px; 
      text-align: center;
    }

    .upload-content { padding: 20px; }

    /* Tabs */
    .upload-tabs { 
      display: flex; 
      border-bottom: 2px solid #eee; 
      margin-bottom: 20px; 
    }
    .tab-btn {
      flex: 1; 
      padding: 12px; 
      border: none; 
      background: none;
      font-weight: 600; 
      color: #666; 
      cursor: pointer; 
      position: relative;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-btn.active::after {
      content: ''; 
      position: absolute; 
      bottom: -2px; 
      left: 0;
      width: 100%; 
      height: 3px; 
      background: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .drop-area {
      border: 2px dashed var(--primary-light); 
      border-radius: 10px;
      padding: 30px 20px; 
      text-align: center; 
      margin-bottom: 20px;
      transition: all 0.3s; 
      cursor: pointer;
    }
    .drop-area.highlight { 
      background: rgba(108,92,231,0.05); 
      border-color: var(--primary); 
    }

    #fileList {
      max-height: 200px; 
      overflow-y: auto; 
      margin-bottom: 20px;
      border: 1px solid #eee; 
      border-radius: 8px; 
      padding: 5px;
    }
    .file-item { 
      display: flex; 
      align-items: center; 
      padding: 10px; 
      background: #f9f9f9; 
      border-radius: 5px; 
      margin-bottom: 5px; 
    }
    .file-info { 
      flex: 1; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .file-size { 
      font-size: 0.8rem; 
      color: #666; 
      margin-right: 10px; 
    }
    .remove-btn { 
      background: none; 
      border: none; 
      color: var(--danger); 
      cursor: pointer; 
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600; 
      color: var(--dark); 
    }
    .form-control {
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 1rem;
    }
    .form-control:focus { 
      border-color: var(--primary); 
      outline: none; 
      box-shadow: 0 0 0 3px rgba(108,92,231,0.1); 
    }

    .datetime-container .form-group {
      margin-bottom: 15px;
    }

    .submit-btn {
      width: 100%; 
      padding: 15px;
      background: linear-gradient(to right, var(--primary), #8e44ad);
      color: white; 
      border: none; 
      border-radius: 8px;
      font-size: 1.1rem; 
      font-weight: 600; 
      cursor: pointer;
      transition: all 0.3s; 
      margin-top: 10px;
    }
    .submit-btn:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 10px 20px rgba(108,92,231,0.3); 
    }

    .files-btn {
      display: inline-block; 
      padding: 12px 25px; 
      background: var(--dark);
      color: white; 
      border-radius: 8px; 
      text-decoration: none; 
      font-weight: 600;
      transition: all 0.3s; 
      transform: translateY(20px); 
      opacity: 0;
      animation: slideUp 0.5s ease-out 0.4s forwards;
    }

    /* Sacred Loader Overlay */
    #sacredLoaderOverlay {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.95); 
      display: none; 
      justify-content: center; 
      align-items: center;
      z-index: 1000; 
      flex-direction: column;
    }

    .sacred-loader {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .divine-light {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: divinePulse 3s ease-in-out infinite alternate;
    }

    @keyframes divinePulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .sacred-cross {
      position: absolute;
      width: 60px;
      height: 180px;
      background-color: var(--gold);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px var(--gold);
    }

    .sacred-cross:after {
      content: '';
      position: absolute;
      width: 180px;
      height: 60px;
      background-color: var(--gold);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px var(--gold);
    }

    .sacred-rays {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .sacred-ray {
      position: absolute;
      width: 4px;
      height: 150px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      top: 50%;
      left: 50%;
      transform-origin: top center;
      animation: sacredRayRotate 12s linear infinite;
    }

    .sacred-ray:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); animation-delay: 0s; }
    .sacred-ray:nth-child(2) { transform: translate(-50%, -50%) rotate(30deg); animation-delay: -1s; }
    .sacred-ray:nth-child(3) { transform: translate(-50%, -50%) rotate(60deg); animation-delay: -2s; }
    .sacred-ray:nth-child(4) { transform: translate(-50%, -50%) rotate(90deg); animation-delay: -3s; }
    .sacred-ray:nth-child(5) { transform: translate(-50%, -50%) rotate(120deg); animation-delay: -4s; }
    .sacred-ray:nth-child(6) { transform: translate(-50%, -50%) rotate(150deg); animation-delay: -5s; }
    .sacred-ray:nth-child(7) { transform: translate(-50%, -50%) rotate(180deg); animation-delay: -6s; }
    .sacred-ray:nth-child(8) { transform: translate(-50%, -50%) rotate(210deg); animation-delay: -7s; }
    .sacred-ray:nth-child(9) { transform: translate(-50%, -50%) rotate(240deg); animation-delay: -8s; }
    .sacred-ray:nth-child(10) { transform: translate(-50%, -50%) rotate(270deg); animation-delay: -9s; }
    .sacred-ray:nth-child(11) { transform: translate(-50%, -50%) rotate(300deg); animation-delay: -10s; }
    .sacred-ray:nth-child(12) { transform: translate(-50%, -50%) rotate(330deg); animation-delay: -11s; }

    @keyframes sacredRayRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .loader-text {
      color: white;
      margin-top: 40px;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }

    .progress-container {
      width: 80%;
      max-width: 400px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 30px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--stained-glass-blue), var(--gold));
      border-radius: 10px;
      position: relative;
      transition: width 0.3s ease;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .percentage {
      position: absolute;
      right: 10px;
      top: -25px;
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    /* Enhanced Success Animation */
    .success-animation {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .cross-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 30px;
    }

    .glowing-cross {
      position: absolute;
      width: 30px;
      height: 120px;
      background: var(--gold);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 30px var(--gold);
      animation: crossPulse 2s infinite alternate;
    }

    .glowing-cross:after {
      content: '';
      position: absolute;
      width: 120px;
      height: 30px;
      background: var(--gold);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 30px var(--gold);
    }

    @keyframes crossPulse {
      0% { opacity: 0.8; box-shadow: 0 0 20px var(--gold); }
      100% { opacity: 1; box-shadow: 0 0 50px var(--gold); }
    }

    .light-burst {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .light-ray {
      position: absolute;
      width: 4px;
      height: 150px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      top: 50%;
      left: 50%;
      transform-origin: top center;
      animation: rayRotate 12s linear infinite;
    }

    .light-ray:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
    .light-ray:nth-child(2) { transform: translate(-50%, -50%) rotate(30deg); }
    .light-ray:nth-child(3) { transform: translate(-50%, -50%) rotate(60deg); }
    .light-ray:nth-child(4) { transform: translate(-50%, -50%) rotate(90deg); }
    .light-ray:nth-child(5) { transform: translate(-50%, -50%) rotate(120deg); }
    .light-ray:nth-child(6) { transform: translate(-50%, -50%) rotate(150deg); }
    .light-ray:nth-child(7) { transform: translate(-50%, -50%) rotate(180deg); }
    .light-ray:nth-child(8) { transform: translate(-50%, -50%) rotate(210deg); }
    .light-ray:nth-child(9) { transform: translate(-50%, -50%) rotate(240deg); }
    .light-ray:nth-child(10) { transform: translate(-50%, -50%) rotate(270deg); }
    .light-ray:nth-child(11) { transform: translate(-50%, -50%) rotate(300deg); }
    .light-ray:nth-child(12) { transform: translate(-50%, -50%) rotate(330deg); }

    @keyframes rayRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .success-text {
      color: var(--gold);
      font-size: 32px;
      font-weight: 700;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: textGlow 1.5s infinite alternate;
    }

    .success-subtext {
      color: white;
      font-size: 18px;
      margin-top: 15px;
      opacity: 0.9;
      max-width: 80%;
      line-height: 1.5;
    }

    .holy-sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px 2px var(--gold);
      animation: sparkleFall linear infinite;
    }

    @keyframes sparkleFall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes textGlow {
      0% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
      100% { text-shadow: 0 0 30px var(--gold), 0 0 50px rgba(255, 215, 0, 0.9); }
    }
  </style>
</head>
<body>
  <!-- Sacred Preloader -->
  <div id="sacredPreloader">
    <div class="sacred-symbol">
      <div class="stained-glass"></div>
      <div class="cross"></div>
      <div class="halo"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
      <div class="light-ray"></div>
    </div>
    <div class="preloader-text">PREPARING THE WAY</div>
    <div class="preloader-progress">
      <div class="preloader-progress-bar"></div>
    </div>
  </div>

  {% if error %}
    <div style="background: #ffebee; color: #d32f2f; padding: 15px; margin-bottom: 20px; border-radius: 8px; max-width: 500px; width: 100%;">
      <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
  {% endif %}

  <div class="upload-container">
    <form id="uploadForm" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="upload-header">
        <h3><i class="fas fa-cloud-upload-alt"></i> GMMI Upload</h3>
      </div>

      <div class="upload-content">
        <div class="upload-tabs">
          <button type="button" class="tab-btn active" data-tab="file-tab">Upload Files</button>
          <button type="button" class="tab-btn" data-tab="youtube-tab">YouTube URL</button>
        </div>

        <!-- File Upload -->
        <div id="file-tab" class="tab-content active">
          <div class="drop-area" id="dropArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Drag & drop files here</p>
            <button type="button" class="browse-btn">Browse Files</button>
            <input type="file" id="fileInput" name="uploaded_file" style="display: none;" multiple>
          </div>
          <div id="fileList"></div>
        </div>

        <!-- YouTube URL -->
        <div id="youtube-tab" class="tab-content">
          <div class="form-group">
            <label for="youtube_url"><i class="fab fa-youtube" style="color: red;"></i> YouTube Video URL</label>
            <input type="url" id="youtube_url" name="youtube_url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
          </div>
        </div>

        <div class="datetime-container">
          <div class="form-group">
            <label for="date"><i class="far fa-calendar-alt"></i> Date</label>
            <input type="date" id="date" name="date" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="time"><i class="far fa-clock"></i> Time</label>
            <input type="time" id="time" name="time" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="company_location"><i class="fas fa-building"></i> Company/Location</label>
          <input type="text" id="company_location" name="company_location" class="form-control" placeholder="Enter company or location" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> Submit
        </button>
      </div>
    </form>
  </div>

  <a href="{% url 'excel_page' %}" class="files-btn">
    <i class="fas fa-folder-open"></i> View Uploaded Files
  </a>

  <!-- Sacred Loader Overlay -->
  <div id="sacredLoaderOverlay">
    <div class="sacred-loader">
      <div class="divine-light"></div>
      <div class="sacred-cross"></div>
      <div class="sacred-rays">
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
        <div class="sacred-ray"></div>
      </div>
    </div>
    <div class="loader-text">BLESSING YOUR UPLOAD</div>
    <div class="progress-container">
      <div class="progress-bar" id="sacredProgressBar"></div>
      <div class="percentage" id="sacredPercentage">0%</div>
    </div>
    
    <div class="success-animation" id="sacredSuccess">
      <div class="cross-container">
        <div class="glowing-cross"></div>
        <div class="light-burst">
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
          <div class="light-ray"></div>
        </div>
      </div>
      <div class="success-text">UPLOAD COMPLETE</div>
      <div class="success-subtext">Your files have been sanctified</div>
      <div class="holy-sparkles" id="holySparkles"></div>
    </div>
  </div>

  <script>
    // Sacred Preloader
    window.addEventListener('load', function() {
      setTimeout(function() {
        const preloader = document.getElementById('sacredPreloader');
        preloader.style.opacity = '0';
        setTimeout(() => preloader.style.display = 'none', 800);
      }, 2000);
    });

    // Create sparkles for success animation
    function createSparkles() {
      const container = document.getElementById('holySparkles');
      const sparkleCount = 30;
      
      for (let i = 0; i < sparkleCount; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.animationDuration = `${3 + Math.random() * 4}s`;
        sparkle.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(sparkle);
      }
    }

    // Tab functionality
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // File upload functionality
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const fileList = document.getElementById('fileList');

    // Set up drag and drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
      dropArea.addEventListener(e, preventDefaults, false);
    });

    function preventDefaults(e) { 
      e.preventDefault(); 
      e.stopPropagation(); 
    }

    ['dragenter', 'dragover'].forEach(e => {
      dropArea.addEventListener(e, () => dropArea.classList.add('highlight'));
    });

    ['dragleave', 'drop'].forEach(e => {
      dropArea.addEventListener(e, () => dropArea.classList.remove('highlight'));
    });

    dropArea.addEventListener('drop', handleDrop, false);
    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFiles);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      fileInput.files = dt.files;
      handleFiles();
    }

    function handleFiles() {
      fileList.innerHTML = '';
      if (!fileInput.files.length) {
        fileList.innerHTML = '<p style="text-align: center; color: #666; padding: 10px;">No files selected</p>';
        return;
      }
      
      Array.from(fileInput.files).forEach(file => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <i class="fas fa-file" style="margin-right: 10px;"></i>
          <div class="file-info">${file.name}</div>
          <div class="file-size">${formatFileSize(file.size)}</div>
          <button type="button" class="remove-btn"><i class="fas fa-times"></i></button>
        `;
        fileItem.querySelector('.remove-btn').addEventListener('click', () => {
          fileItem.remove();
          if (!fileList.children.length) {
            fileList.innerHTML = '<p style="text-align: center; color: #666; padding: 10px;">No files selected</p>';
          }
        });
        fileList.appendChild(fileItem);
      });
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Form submission with sacred loader
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      createSparkles();
      
      const overlay = document.getElementById('sacredLoaderOverlay');
      const submitBtn = document.getElementById('submitBtn');
      const progressBar = document.getElementById('sacredProgressBar');
      const percentage = document.getElementById('sacredPercentage');
      
      // Show sacred loader
      overlay.style.display = 'flex';
      submitBtn.disabled = true;
      
      // Simulate upload progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 5;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
        percentage.textContent = Math.round(progress) + '%';
      }, 200);
      
      // Simulate upload completion
      const uploadTime = 3000 + Math.random() * 2000;
      
      setTimeout(() => {
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        percentage.textContent = '100%';
        
        // Show success animation
        setTimeout(() => {
          document.querySelector('.sacred-loader').style.display = 'none';
          document.querySelector('.loader-text').style.display = 'none';
          document.querySelector('.progress-container').style.display = 'none';
          document.getElementById('sacredSuccess').style.display = 'flex';
          
          // Submit the form after showing success
          setTimeout(() => {
            this.submit();
          }, 3000);
        }, 500);
      }, uploadTime);
    });
  </script>
</body>
</html>
