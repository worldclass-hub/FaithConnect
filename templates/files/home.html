{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMMI Ultra Upload</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --danger: #ff4757;
      --success: #2ed573;
      --dark: #2d3436;
      --cyber-blue: #00f5ff;
      --cyber-pink: #ff00f5;
      --cyber-purple: #8a2be2;
      --cyber-green: #00ff87;
      --gold: #ffd700;
      --gold-light: #fffacd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Cybernetic Preloader */
    #cyberneticPreloader {
      position: fixed; 
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      z-index: 9999; 
      transition: opacity 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .cybernetic-core {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .circuit-board {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0, 245, 255, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(0, 245, 255, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      border-radius: 5px;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
    }

    .cybernetic-spiral {
      position: absolute;
      width: 180px;
      height: 180px;
      top: 10px;
      left: 10px;
      border: 2px solid transparent;
      border-top-color: var(--cyber-blue);
      border-radius: 50%;
      animation: spiralRotate 3s linear infinite;
    }

    .cybernetic-spiral:nth-child(2) {
      width: 150px;
      height: 150px;
      top: 25px;
      left: 25px;
      border-top-color: var(--cyber-pink);
      animation-delay: 0.2s;
    }

    .cybernetic-spiral:nth-child(3) {
      width: 120px;
      height: 120px;
      top: 40px;
      left: 40px;
      border-top-color: var(--cyber-green);
      animation-delay: 0.4s;
    }

    .cybernetic-center {
      position: absolute;
      width: 60px;
      height: 60px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--cyber-blue), var(--cyber-purple));
      border-radius: 50%;
      box-shadow: 
        0 0 20px var(--cyber-blue),
        0 0 40px var(--cyber-purple);
      animation: cyberPulse 2s ease-in-out infinite alternate;
    }

    .circuit-node {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--cyber-blue);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyber-blue);
    }

    .node-1 { top: 20%; left: 20%; animation: nodePulse 3s infinite; }
    .node-2 { top: 20%; right: 20%; animation: nodePulse 3s infinite 0.5s; }
    .node-3 { bottom: 20%; right: 20%; animation: nodePulse 3s infinite 1s; }
    .node-4 { bottom: 20%; left: 20%; animation: nodePulse 3s infinite 1.5s; }
    .node-5 { top: 50%; left: 10%; animation: nodePulse 3s infinite 0.25s; }
    .node-6 { top: 10%; left: 50%; animation: nodePulse 3s infinite 0.75s; }
    .node-7 { top: 50%; right: 10%; animation: nodePulse 3s infinite 1.25s; }
    .node-8 { bottom: 10%; left: 50%; animation: nodePulse 3s infinite 1.75s; }

    @keyframes spiralRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes cyberPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .preloader-text {
      color: white;
      margin-top: 40px;
      font-size: 1.2rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--cyber-blue);
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      0% { text-shadow: 0 0 10px var(--cyber-blue); }
      100% { text-shadow: 0 0 20px var(--cyber-blue), 0 0 30px var(--cyber-pink); }
    }

    .preloader-progress {
      width: 300px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .preloader-progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyber-blue), var(--cyber-pink));
      box-shadow: 0 0 10px var(--cyber-blue);
      animation: loadingProgress 2s ease-in-out forwards;
    }

    @keyframes loadingProgress {
      0% { width: 0; }
      100% { width: 100%; }
    }

    .binary-stream {
      position: absolute;
      bottom: 20px;
      width: 100%;
      height: 20px;
      color: var(--cyber-green);
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      overflow: hidden;
    }

    .binary-digit {
      display: inline-block;
      animation: binaryFall 10s linear infinite;
      opacity: 0.7;
    }

    @keyframes binaryFall {
      0% { transform: translateY(-100px); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(100px); opacity: 0; }
    }

    /* Main container */
    .upload-container {
      width: 100%; 
      max-width: 500px; 
      background: white;
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden; 
      margin: 20px 0;
      transform: translateY(20px); 
      opacity: 0;
      animation: slideUp 0.5s ease-out 0.3s forwards;
    }

    @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

    .upload-header {
      background: linear-gradient(to right, var(--primary), #8e44ad);
      color: white; 
      padding: 20px; 
      text-align: center;
    }

    .upload-content { padding: 20px; }

    /* Tabs */
    .upload-tabs { 
      display: flex; 
      border-bottom: 2px solid #eee; 
      margin-bottom: 20px; 
    }
    .tab-btn {
      flex: 1; 
      padding: 12px; 
      border: none; 
      background: none;
      font-weight: 600; 
      color: #666; 
      cursor: pointer; 
      position: relative;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-btn.active::after {
      content: ''; 
      position: absolute; 
      bottom: -2px; 
      left: 0;
      width: 100%; 
      height: 3px; 
      background: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .drop-area {
      border: 2px dashed var(--primary-light); 
      border-radius: 10px;
      padding: 30px 20px; 
      text-align: center; 
      margin-bottom: 20px;
      transition: all 0.3s; 
      cursor: pointer;
    }
    .drop-area.highlight { 
      background: rgba(108,92,231,0.05); 
      border-color: var(--primary); 
    }

    #fileList {
      max-height: 200px; 
      overflow-y: auto; 
      margin-bottom: 20px;
      border: 1px solid #eee; 
      border-radius: 8px; 
      padding: 5px;
    }
    .file-item { 
      display: flex; 
      align-items: center; 
      padding: 10px; 
      background: #f9f9f9; 
      border-radius: 5px; 
      margin-bottom: 5px; 
    }
    .file-info { 
      flex: 1; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .file-size { 
      font-size: 0.8rem; 
      color: #666; 
      margin-right: 10px; 
    }
    .remove-btn { 
      background: none; 
      border: none; 
      color: var(--danger); 
      cursor: pointer; 
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600; 
      color: var(--dark); 
    }
    .form-control {
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 1rem;
    }
    .form-control:focus { 
      border-color: var(--primary); 
      outline: none; 
      box-shadow: 0 0 0 3px rgba(108,92,231,0.1); 
    }

    /* Changed from grid to regular form-group */
    .datetime-container .form-group {
      margin-bottom: 15px;
    }

    .submit-btn {
      width: 100%; 
      padding: 15px;
      background: linear-gradient(to right, var(--primary), #8e44ad);
      color: white; 
      border: none; 
      border-radius: 8px;
      font-size: 1.1rem; 
      font-weight: 600; 
      cursor: pointer;
      transition: all 0.3s; 
      margin-top: 10px;
    }
    .submit-btn:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 10px 20px rgba(108,92,231,0.3); 
    }

    .files-btn {
      display: inline-block; 
      padding: 12px 25px; 
      background: var(--dark);
      color: white; 
      border-radius: 8px; 
      text-decoration: none; 
      font-weight: 600;
      transition: all 0.3s; 
      transform: translateY(20px); 
      opacity: 0;
      animation: slideUp 0.5s ease-out 0.4s forwards;
    }

    /* Cybernetic Loader Overlay */
    #cyberneticLoaderOverlay {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.95); 
      display: none; 
      justify-content: center; 
      align-items: center;
      z-index: 1000; 
      flex-direction: column;
    }

    .cybernetic-loader {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .circuit-loader {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0, 245, 255, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(0, 245, 255, 0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      border-radius: 10px;
      box-shadow: 0 0 50px rgba(0, 245, 255, 0.3);
    }

    .cybernetic-rings {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .cyber-ring {
      position: absolute;
      border: 2px solid;
      border-radius: 50%;
      animation: cyberRingPulse 4s ease-in-out infinite;
    }

    .cyber-ring-1 {
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      border-color: var(--cyber-blue);
    }

    .cyber-ring-2 {
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      border-color: var(--cyber-pink);
      animation-delay: 0.5s;
    }

    .cyber-ring-3 {
      width: 40%;
      height: 40%;
      top: 30%;
      left: 30%;
      border-color: var(--cyber-green);
      animation-delay: 1s;
    }

    @keyframes cyberRingPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .cybernetic-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }

    .grid-node {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .grid-node::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--cyber-blue);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyber-blue);
      animation: gridNodePulse 2s infinite;
    }

    @keyframes gridNodePulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .loader-text {
      color: white;
      margin-top: 40px;
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 15px var(--cyber-blue);
      animation: textPulse 2s infinite alternate;
    }

    @keyframes textPulse {
      0% { opacity: 0.8; text-shadow: 0 0 15px var(--cyber-blue); }
      100% { opacity: 1; text-shadow: 0 0 25px var(--cyber-blue), 0 0 35px var(--cyber-pink); }
    }

    .progress-container {
      width: 80%;
      max-width: 400px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 30px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyber-blue), var(--cyber-pink));
      border-radius: 10px;
      position: relative;
      transition: width 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.3);
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .percentage {
      position: absolute;
      right: 10px;
      top: -25px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 0 10px var(--cyber-blue);
    }

    /* Enhanced Success Animation */
    .success-animation {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .success-explosion {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 30px;
    }

    .explosion-core {
      position: absolute;
      width: 80px;
      height: 80px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--gold), var(--gold-light));
      border-radius: 50%;
      box-shadow: 0 0 40px var(--gold);
      z-index: 10;
      animation: corePulse 1.5s infinite alternate;
    }

    .explosion-particle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--gold);
    }

    .particle-1 {
      top: 20%;
      left: 20%;
      animation: particleExplode 1.5s infinite;
    }
    .particle-2 {
      top: 20%;
      right: 20%;
      animation: particleExplode 1.5s infinite 0.2s;
    }
    .particle-3 {
      bottom: 20%;
      right: 20%;
      animation: particleExplode 1.5s infinite 0.4s;
    }
    .particle-4 {
      bottom: 20%;
      left: 20%;
      animation: particleExplode 1.5s infinite 0.6s;
    }
    .particle-5 {
      top: 10%;
      left: 50%;
      animation: particleExplode 1.5s infinite 0.1s;
    }
    .particle-6 {
      top: 50%;
      right: 10%;
      animation: particleExplode 1.5s infinite 0.3s;
    }
    .particle-7 {
      bottom: 10%;
      left: 50%;
      animation: particleExplode 1.5s infinite 0.5s;
    }
    .particle-8 {
      top: 50%;
      left: 10%;
      animation: particleExplode 1.5s infinite 0.7s;
    }

    @keyframes corePulse {
      0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 40px var(--gold); }
      100% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 60px var(--gold); }
    }

    @keyframes particleExplode {
      0% { 
        transform: translate(0, 0) scale(1); 
        opacity: 1;
      }
      50% { 
        transform: translate(var(--tx), var(--ty)) scale(1.5); 
        opacity: 0.8;
      }
      100% { 
        transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5)) scale(0); 
        opacity: 0;
      }
    }

    .success-text {
      color: var(--gold);
      font-size: 32px;
      font-weight: 700;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
      animation: textGlow 1.5s infinite alternate;
    }

    .success-subtext {
      color: white;
      font-size: 18px;
      margin-top: 15px;
      opacity: 0.9;
      max-width: 80%;
      line-height: 1.5;
    }

    .success-sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px white;
      animation: sparkleFall linear infinite;
    }

    @keyframes sparkleFall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes textGlow {
      0% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
      100% { text-shadow: 0 0 30px var(--gold), 0 0 50px rgba(255, 215, 0, 0.9); }
    }
  </style>
</head>
<body>
  <!-- Cybernetic Preloader -->
  <div id="cyberneticPreloader">
    <div class="cybernetic-core">
      <div class="circuit-board"></div>
      <div class="cybernetic-spiral"></div>
      <div class="cybernetic-spiral"></div>
      <div class="cybernetic-spiral"></div>
      <div class="cybernetic-center"></div>
      <div class="circuit-node node-1"></div>
      <div class="circuit-node node-2"></div>
      <div class="circuit-node node-3"></div>
      <div class="circuit-node node-4"></div>
      <div class="circuit-node node-5"></div>
      <div class="circuit-node node-6"></div>
      <div class="circuit-node node-7"></div>
      <div class="circuit-node node-8"></div>
    </div>
    <div class="preloader-text">INITIALIZING CYBERNETIC CORE</div>
    <div class="preloader-progress">
      <div class="preloader-progress-bar"></div>
    </div>
    <div class="binary-stream" id="binaryStream"></div>
  </div>

  {% if error %}
    <div style="background: #ffebee; color: #d32f2f; padding: 15px; margin-bottom: 20px; border-radius: 8px; max-width: 500px; width: 100%;">
      <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
  {% endif %}

  <div class="upload-container">
    <form id="uploadForm" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="upload-header">
        <h3><i class="fas fa-cloud-upload-alt"></i> GMMI Cyber Upload</h3>
      </div>

      <div class="upload-content">
        <div class="upload-tabs">
          <button type="button" class="tab-btn active" data-tab="file-tab">Upload Files</button>
          <button type="button" class="tab-btn" data-tab="youtube-tab">YouTube URL</button>
        </div>

        <!-- File Upload -->
        <div id="file-tab" class="tab-content active">
          <div class="drop-area" id="dropArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Drag & drop files here</p>
            <button type="button" class="browse-btn">Browse Files</button>
            <input type="file" id="fileInput" name="uploaded_file" style="display: none;" multiple>
          </div>
          <div id="fileList"></div>
        </div>

        <!-- YouTube URL -->
        <div id="youtube-tab" class="tab-content">
          <div class="form-group">
            <label for="youtube_url"><i class="fab fa-youtube" style="color: red;"></i> YouTube Video URL</label>
            <input type="url" id="youtube_url" name="youtube_url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
          </div>
        </div>

        <!-- Changed from datetime-grid to regular form-groups -->
        <div class="datetime-container">
          <div class="form-group">
            <label for="date"><i class="far fa-calendar-alt"></i> Date</label>
            <input type="date" id="date" name="date" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="time"><i class="far fa-clock"></i> Time</label>
            <input type="time" id="time" name="time" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="company_location"><i class="fas fa-building"></i> Company/Location</label>
          <input type="text" id="company_location" name="company_location" class="form-control" placeholder="Enter company or location" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> Cyber Upload
        </button>
      </div>
    </form>
  </div>

  <a href="{% url 'excel_page' %}" class="files-btn">
    <i class="fas fa-folder-open"></i> View Uploaded Files
  </a>

  <!-- Cybernetic Loader Overlay -->
  <div id="cyberneticLoaderOverlay">
    <div class="cybernetic-loader">
      <div class="circuit-loader"></div>
      <div class="cybernetic-rings">
        <div class="cyber-ring cyber-ring-1"></div>
        <div class="cyber-ring cyber-ring-2"></div>
        <div class="cyber-ring cyber-ring-3"></div>
      </div>
      <div class="cybernetic-grid">
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>

        <div class="grid-node"></div>
        <div class="grid-node"></div>
        <div class="grid-node"></div>
      </div>
    </div>
    <div class="loader-text">ENGAGING CYBER UPLOAD</div>
    <div class="progress-container">
      <div class="progress-bar" id="cyberneticProgressBar"></div>
      <div class="percentage" id="cyberneticPercentage">0%</div>
    </div>
    
    <div class="success-animation" id="cyberneticSuccess">
      <div class="success-explosion">
        <div class="explosion-core"></div>
        <div class="explosion-particle particle-1" style="--tx: -50px; --ty: -50px;"></div>
        <div class="explosion-particle particle-2" style="--tx: 50px; --ty: -50px;"></div>
        <div class="explosion-particle particle-3" style="--tx: 50px; --ty: 50px;"></div>
        <div class="explosion-particle particle-4" style="--tx: -50px; --ty: 50px;"></div>
        <div class="explosion-particle particle-5" style="--tx: 0px; --ty: -70px;"></div>
        <div class="explosion-particle particle-6" style="--tx: 70px; --ty: 0px;"></div>
        <div class="explosion-particle particle-7" style="--tx: 0px; --ty: 70px;"></div>
        <div class="explosion-particle particle-8" style="--tx: -70px; --ty: 0px;"></div>
      </div>
      <div class="success-text">UPLOAD COMPLETE</div>
      <div class="success-subtext">Files successfully transmitted to secure servers</div>
      <div class="success-sparkles" id="successSparkles"></div>
    </div>
  </div>

  <script>
    // Generate binary stream for preloader
    function generateBinaryStream() {
      const binaryStream = document.getElementById('binaryStream');
      const digits = 50;
      let html = '';
      
      for (let i = 0; i < digits; i++) {
        const digit = Math.random() > 0.5 ? '1' : '0';
        const delay = Math.random() * 5;
        html += `<span class="binary-digit" style="animation-delay: ${delay}s">${digit}</span>`;
      }
      
      binaryStream.innerHTML = html;
    }

    // Create sparkles for success animation
    function createSparkles() {
      const container = document.getElementById('successSparkles');
      const sparkleCount = 30;
      
      for (let i = 0; i < sparkleCount; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.animationDuration = `${3 + Math.random() * 4}s`;
        sparkle.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(sparkle);
      }
    }

    // Cybernetic Preloader
    window.addEventListener('load', function() {
      generateBinaryStream();
      createSparkles();
      
      setTimeout(function() {
        const preloader = document.getElementById('cyberneticPreloader');
        preloader.style.opacity = '0';
        setTimeout(() => preloader.style.display = 'none', 800);
      }, 2500);
    });

    // Tab functionality
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // File upload functionality
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const fileList = document.getElementById('fileList');

    // Set up drag and drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
      dropArea.addEventListener(e, preventDefaults, false);
    });

    function preventDefaults(e) { 
      e.preventDefault(); 
      e.stopPropagation(); 
    }

    ['dragenter', 'dragover'].forEach(e => {
      dropArea.addEventListener(e, () => dropArea.classList.add('highlight'));
    });

    ['dragleave', 'drop'].forEach(e => {
      dropArea.addEventListener(e, () => dropArea.classList.remove('highlight'));
    });

    dropArea.addEventListener('drop', handleDrop, false);
    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFiles);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      fileInput.files = dt.files;
      handleFiles();
    }

    function handleFiles() {
      fileList.innerHTML = '';
      if (!fileInput.files.length) {
        fileList.innerHTML = '<p style="text-align: center; color: #666; padding: 10px;">No files selected</p>';
        return;
      }
      
      Array.from(fileInput.files).forEach(file => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <i class="fas fa-file" style="margin-right: 10px;"></i>
          <div class="file-info">${file.name}</div>
          <div class="file-size">${formatFileSize(file.size)}</div>
          <button type="button" class="remove-btn"><i class="fas fa-times"></i></button>
        `;
        fileItem.querySelector('.remove-btn').addEventListener('click', () => {
          fileItem.remove();
          if (!fileList.children.length) {
            fileList.innerHTML = '<p style="text-align: center; color: #666; padding: 10px;">No files selected</p>';
          }
        });
        fileList.appendChild(fileItem);
      });
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Form submission with cybernetic loader
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const overlay = document.getElementById('cyberneticLoaderOverlay');
      const submitBtn = document.getElementById('submitBtn');
      const progressBar = document.getElementById('cyberneticProgressBar');
      const percentage = document.getElementById('cyberneticPercentage');
      
      // Show cybernetic loader
      overlay.style.display = 'flex';
      submitBtn.disabled = true;
      
      // Simulate upload progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 5;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
        percentage.textContent = Math.round(progress) + '%';
      }, 200);
      
      // Simulate upload completion
      const uploadTime = 3000 + Math.random() * 2000;
      
      setTimeout(() => {
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        percentage.textContent = '100%';
        
        // Show success animation
        setTimeout(() => {
          document.querySelector('.cybernetic-loader').style.display = 'none';
          document.querySelector('.loader-text').style.display = 'none';
          document.querySelector('.progress-container').style.display = 'none';
          document.getElementById('cyberneticSuccess').style.display = 'flex';
          
          // Submit the form after showing success
          setTimeout(() => {
            this.submit();
          }, 3000);
        }, 500);
      }, uploadTime);
    });
  </script>
</body>
</html>
