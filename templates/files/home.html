{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMMI files Upload</title>
  <link rel="icon" href="{% static 'login-form/images/GMMI_LOGO.png' %}" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      background: url("{% static 'login-form/images/wallpaper2.jpg' %}") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 25px;
    }

    .drop-area {
      border: 2px dashed #6c5ce7;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .drop-area:hover {
      background: #f1f1f1;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #f1f1f1;
      margin-top: 5px;
      border-radius: 5px;
    }

    .location-container {
      text-align: left;
      margin-top: 12px;
    }

    .location-container label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .location-container input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .send-btn {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }

    .send-btn:hover {
      background: #4b44c6;
    }

    /* 🔹 Dashed Fancy Input Boxes */
    .dashed-input-box {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 14px 20px;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .dashed-input-box:hover {
      background-color: #f1f1f1;
    }

    .dashed-label {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
      text-align: center;
    }

    .dashed-input-box input[type="date"],
    .dashed-input-box input[type="time"] {
      width: 100%;
      max-width: 180px;
      border: none;
      background: transparent;
      font-size: 16px;
      text-align: center;
      outline: none;
      cursor: pointer;
    }

    /* 🔹 Home Button */
    .home-text {
      display: inline-block;
      background-color: #6c5ce7;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .home-text:hover {
      background-color: #4b44c6;
      transform: translateY(-2px);
    }

    .home-text:active {
      background-color: #2ed573;
      transform: scale(0.97);
    }

    .home-text a {
      color: inherit;
      text-decoration: none;
      display: block;
    }

    @media (max-width: 700px) {
      .upload-container {
        width: 100%;
        max-width: 90%;
        padding: 20px;
      }
    }

    /* 🔹 Crazy Loader Overlay */
    #crazyLoaderOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .crazy-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .balls {
      display: flex;
      gap: 12px;
    }

    .balls div {
      width: 20px;
      height: 20px;
      background: #6c5ce7;
      border-radius: 50%;
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
      animation-duration: 0.7s;
      animation-iteration-count: infinite;
    }

    .balls div:nth-child(1) { animation-name: bounce1; animation-delay: 0s; }
    .balls div:nth-child(2) { animation-name: bounce2; animation-delay: 0.15s; }
    .balls div:nth-child(3) { animation-name: bounce3; animation-delay: 0.3s; }
    .balls div:nth-child(4) { animation-name: bounce4; animation-delay: 0.45s; }

    @keyframes bounce1 {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px) rotate(45deg); background: #ff4757;}
    }
    @keyframes bounce2 {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-40px) rotate(-45deg); background: #ffa502;}
    }
    @keyframes bounce3 {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-35px) rotate(90deg); background: #1e90ff;}
    }
    @keyframes bounce4 {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-25px) rotate(-90deg); background: #2ed573;}
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 5px solid #6c5ce7;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
{% if error %}
  <div style="background: #ffdddd; color: red; padding: 10px; margin-bottom: 10px; border: 1px solid red;">
    {{ error }}
  </div>
{% endif %}

  <div class="upload-container">
    <h3>Upload Files or Submit YouTube Link</h3>

  <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="drop-area" onclick="document.getElementById('fileInput').click()">
        Drop files here <br /> Or <br />
        <button type="button">Browse</button>
      </div>

      <input
        type="file"
        id="fileInput"
        name="uploaded_file"
        style="display: none;"
        accept=".jpg,.jpeg,.png,.gif,.mp4,.webm,.ogg,.mp3,.wav,.aac,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip"
        onchange="handleFiles(event)"
      />

      <div id="fileList"></div>

      <!-- YouTube Link -->
      <div class="location-container" style="margin-top: 20px;">
        <label for="youtube_url">Or enter YouTube video link</label>
        <input
          type="url"
          id="youtube_url"
          name="youtube_url"
          placeholder="https://www.youtube.com/watch?v=..."
          pattern="https?://.*"
          title="Enter a valid URL"
        />
      </div>

      <!-- Dashed Date Box -->
      <label class="dashed-input-box">
        <span class="dashed-label">Select Date</span>
        <input type="date" name="date" required />
      </label>

      <!-- Dashed Time Box -->
      <label class="dashed-input-box">
        <span class="dashed-label">Select Time</span>
        <input type="time" name="time" required />
      </label>

      <!-- Company/Location -->
      <div class="location-container">
        <label for="company_location">Company / Location / Title</label>
        <input
          type="text"
          id="company_location"
          name="company_location"
          placeholder="Enter company or location or title"
          required
        />
      </div>

      <button type="submit" class="send-btn" id="submitBtn">Send File or Link</button>
    </form>
  </div>

  <!-- Crazy Loader Overlay -->
  <div id="crazyLoaderOverlay">
    <div class="crazy-loader">
      <div class="balls">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Home Button Centered -->
  <div style="text-align: center;">
    <div class="home-text">
      <a href="{% url 'excel_page' %}">Files Page</a>
    </div>
  </div>

  <script>
    function handleFiles(event) {
      const fileList = document.getElementById("fileList");
      fileList.innerHTML = "";

      Array.from(event.target.files).forEach((file) => {
        const fileItem = document.createElement("div");
        fileItem.classList.add("file-item");

        const fileName = document.createElement("span");
        fileName.textContent = file.name;

        const removeButton = document.createElement("span");
        removeButton.textContent = "✕";
        removeButton.style.cursor = "pointer";
        removeButton.onclick = () => fileItem.remove();

        fileItem.appendChild(fileName);
        fileItem.appendChild(removeButton);
        fileList.appendChild(fileItem);
      });
    }

    document.getElementById("uploadForm").addEventListener("submit", function () {
      document.getElementById("crazyLoaderOverlay").style.display = "flex";
      document.getElementById("submitBtn").disabled = true;
    });
  </script>
</body>
</html>
