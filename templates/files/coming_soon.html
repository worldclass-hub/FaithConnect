{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coming Soon | GMMI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'login-form/images/GMMI_LOGO.png' %}" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 1s ease-out forwards;
    }
  </style>
</head>
<body class="bg-white text-gray-800 font-sans">

  <!-- Fullscreen Flex -->
  <div class="flex flex-col md:flex-row min-h-screen">

    <!-- Background Image (shows on all screen sizes now) -->
    <div class="w-full md:w-1/2 h-64 md:h-auto">
      {% if page.background_image_url %}
        <img src="{{ page.background_image_url }}" alt="Coming Soon" class="w-full h-full object-cover" />
      {% else %}
        <img src="{% static 'login-form/images/GMMI1.PNG' %}" alt="Coming Soon" class="w-full h-full object-cover" />
      {% endif %}
    </div>

    <!-- Right Content -->
    <div class="w-full md:w-1/2 flex flex-col justify-center items-center px-6 py-10">
      <div class="max-w-md w-full animate-fade-in-up text-center">
        <!-- Logo -->
        <a href="{% url 'excel_page' %}" class="flex items-center justify-center gap-2 mb-6">
          <img src="{% static 'login-form/images/GMMI_LOGO.png' %}" alt="Logo" class="h-10">
          <span class="text-2xl font-bold text-green-700">GMMI</span>
        </a>

        <!-- Title Note -->
        <h2 class="text-xl font-semibold text-gray-700 mb-4">
          {{ page.note }}
        </h2>

        <!-- Newsletter Form -->
        <form method="post" action="#" id="contact_form" class="space-y-4">
          {% csrf_token %}
          <p class="text-gray-600 font-medium">{% trans "Follow us for updates now!" %}</p>
          <div class="flex items-center border border-gray-300 rounded-md overflow-hidden">
            <input type="email" name="email" required placeholder="{% trans 'Email address' %}"
                   class="w-full px-4 py-2 outline-none text-sm">
            <button type="submit" class="bg-green-700 text-white px-4 py-2 text-sm font-semibold hover:bg-green-800">
              {% trans "Notify me" %}
            </button>
          </div>
        </form>

        <!-- Social Icons -->
        <div class="mt-6 flex justify-center gap-4 text-gray-500 text-lg">
          <a href="#"><i class="icon icon-facebook"></i></a>
          <a href="#"><i class="icon icon-twitter"></i></a>
          <a href="#"><i class="icon icon-instagram"></i></a>
          <a href="#"><i class="icon icon-youtube"></i></a>
        </div>

        <!-- Back Home -->
        <a href="{% url 'excel_page' %}" class="block mt-6 text-sm text-gray-500 hover:text-gray-800 font-medium">
          {% trans "Home" %}
        </a>
      </div>
    </div>
  </div>

  <!-- Preloader -->
  <div id="newsletterPreloader" class="hidden fixed inset-0 bg-white bg-opacity-90 z-50 flex flex-col justify-center items-center">
    <p class="text-gray-700 text-lg font-semibold mb-4">Submitting<span class="animate-pulse">...</span></p>
    <div class="flex gap-2">
      <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce"></div>
      <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce delay-150"></div>
      <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce delay-300"></div>
    </div>
  </div>

  <!-- JS Script -->
  <script>
    document.getElementById('contact_form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.querySelector('input[type="email"]').value.trim();
      const preloader = document.getElementById('newsletterPreloader');
      if (!email) return;

      preloader.classList.remove('hidden');

      fetch("{% url 'coming_soon' %}", {
        method: "POST",
        headers: {
          "X-Requested-With": "XMLHttpRequest",
          "X-CSRFToken": "{{ csrf_token }}"
        },
        body: new URLSearchParams({ email: email })
      })
      .then(res => res.json())
      .then(data => {
        preloader.classList.add('hidden');
        if (data.status === 'success') {
          alert("Thank you for subscribing!");
        } else {
          alert(data.message || "Something went wrong.");
        }
      })
      .catch(() => {
        preloader.classList.add('hidden');
        alert("Something went wrong.");
      });
    });
  </script>

</body>
</html>
